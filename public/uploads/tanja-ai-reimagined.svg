<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="nightSky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#nightSky)" rx="24"/>

  <!-- Magical Dust Particles -->
  <g fill="#FEF08A" opacity="0.6">
    <circle cx="120" cy="140" r="3"/>
    <circle cx="280" cy="90" r="4"/>
    <circle cx="160" cy="380" r="2.5"/>
    <circle cx="680" cy="160" r="3.5"/>
    <circle cx="710" cy="420" r="4"/>
    <circle cx="220" cy="510" r="3"/>
    <circle cx="580" cy="520" r="2"/>
  </g>

  <!-- Friendly Little Forest Dragon (inspired by Tanja's green creation) -->
  <!-- Stem / Branch Body -->
  <path d="M 60,340 C 200,320 320,350 480,260" fill="none" stroke="#059669" stroke-width="32" stroke-linecap="round"/>
  <path d="M 60,340 C 200,320 320,350 480,260" fill="none" stroke="#34D399" stroke-width="20" stroke-linecap="round"/>

  <!-- Spikes / Leaves from the drawing -->
  <polygon points="260,325 285,250 310,330" fill="#10B981" stroke="#047857" stroke-width="4"/>
  <polygon points="345,305 375,230 400,305" fill="#10B981" stroke="#047857" stroke-width="4"/>
  <polygon points="380,310 405,375 430,290" fill="#10B981" stroke="#047857" stroke-width="4"/>

  <!-- Glowing Aura behind Star -->
  <circle cx="530" cy="235" r="90" fill="#FBBF24" opacity="0.25" filter="url(#starGlow)"/>

  <!-- Giant Magical Golden-Emerald Star (Tanja's star) -->
  <g filter="url(#starGlow)" transform="translate(530, 235)">
    <path d="M 0,-75 L 22,-22 L 78,-22 L 32,12 L 49,65 L 0,32 L -49,65 L -32,12 L -78,-22 L -22,-22 Z" fill="#FDE047" stroke="#F59E0B" stroke-width="6"/>
    <circle cx="0" cy="0" r="22" fill="#FEF08A"/>
    <!-- Cute friendly face on the star -->
    <circle cx="-7" cy="-3" r="3.5" fill="#451A03"/>
    <circle cx="7" cy="-3" r="3.5" fill="#451A03"/>
    <path d="M -6,6 Q 0,12 6,6" fill="none" stroke="#451A03" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-12" cy="4" r="4" fill="#FDA4AF" opacity="0.8"/>
    <circle cx="12" cy="4" r="4" fill="#FDA4AF" opacity="0.8"/>
  </g>

  <!-- Two Little Birds / Sparks in bottom corner (from Tanja's ^^ marks) -->
  <g stroke="#34D399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 180,470 L 195,450 L 210,470" />
    <path d="M 230,490 L 245,470 L 260,490" />
  </g>

  <!-- Glowing magical swirls -->
  <path d="M 440,290 Q 480,360 550,330 T 600,240" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="8,6" opacity="0.8"/>

  <!-- Signature Badge -->
  <rect x="50" y="520" width="220" height="42" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="70" y="547" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" fill="#FBBF24" font-weight="bold">✨ AI-Reimagined • TANJA</text>
</svg>
