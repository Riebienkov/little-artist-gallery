<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="castleSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="50%" stop-color="#FDF4FF" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#castleSky)" rx="24"/>

  <!-- Rainbow -->
  <g opacity="0.85">
    <path d="M 50,480 A 350,300 0 0,1 750,480" fill="none" stroke="#F87171" stroke-width="16"/>
    <path d="M 64,480 A 336,286 0 0,1 736,480" fill="none" stroke="#FB923C" stroke-width="16"/>
    <path d="M 78,480 A 322,272 0 0,1 722,480" fill="none" stroke="#FACC15" stroke-width="16"/>
    <path d="M 92,480 A 308,258 0 0,1 708,480" fill="none" stroke="#4ADE80" stroke-width="16"/>
    <path d="M 106,480 A 294,244 0 0,1 694,480" fill="none" stroke="#38BDF8" stroke-width="16"/>
    <path d="M 120,480 A 280,230 0 0,1 680,480" fill="none" stroke="#A855F7" stroke-width="16"/>
  </g>

  <!-- Green Rolling Hills -->
  <path d="M -50,520 Q 200,450 450,500 Q 650,530 850,470 L 850,600 L -50,600 Z" fill="#86EFAC" stroke="#22C55E" stroke-width="6"/>
  <path d="M -50,550 Q 250,510 500,560 Q 700,530 850,540 L 850,600 L -50,600 Z" fill="#4ADE80" stroke="#16A34A" stroke-width="6"/>

  <!-- Fairy Castle -->
  <g transform="translate(230, 200)">
    <!-- Central Tower -->
    <rect x="110" y="100" width="120" height="180" fill="#FDE047" stroke="#CA8A04" stroke-width="6" rx="6"/>
    <!-- Central Roof -->
    <polygon points="170,10 90,100 250,100" fill="#EC4899" stroke="#BE185D" stroke-width="6" stroke-linejoin="round"/>
    <!-- Flag -->
    <path d="M 170,10 L 170,-20 L 210,-5 L 170,5" fill="#3B82F6" stroke="#1D4ED8" stroke-width="3"/>

    <!-- Left Tower -->
    <rect x="20" y="140" width="80" height="140" fill="#BAE6FD" stroke="#0284C7" stroke-width="6" rx="4"/>
    <polygon points="60,60 10,140 110,140" fill="#8B5CF6" stroke="#6D28D9" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 60,60 L 60,35 L 85,45 L 60,53" fill="#F43F5E" stroke="#BE123C" stroke-width="2"/>

    <!-- Right Tower -->
    <rect x="240" y="140" width="80" height="140" fill="#BAE6FD" stroke="#0284C7" stroke-width="6" rx="4"/>
    <polygon points="280,60 230,140 330,140" fill="#8B5CF6" stroke="#6D28D9" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 280,60 L 280,35 L 305,45 L 280,53" fill="#F43F5E" stroke="#BE123C" stroke-width="2"/>

    <!-- Castle Gate -->
    <path d="M 145,280 L 145,210 Q 170,185 195,210 L 195,280 Z" fill="#78350F" stroke="#451A03" stroke-width="5"/>
    <circle cx="185" cy="245" r="4" fill="#FDE047"/>

    <!-- Windows with smiles -->
    <path d="M 155,160 L 155,135 Q 170,120 185,135 L 185,160 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="4"/>
    <path d="M 48,190 L 48,170 Q 60,160 72,170 L 72,190 Z" fill="#FEF08A" stroke="#0284C7" stroke-width="3"/>
    <path d="M 268,190 L 268,170 Q 280,160 292,170 L 292,190 Z" fill="#FEF08A" stroke="#0284C7" stroke-width="3"/>
  </g>

  <!-- Friendly Little Dragon blowing bubbles -->
  <g transform="translate(560, 360)">
    <!-- Body -->
    <ellipse cx="60" cy="80" rx="45" ry="50" fill="#A7F3D0" stroke="#059669" stroke-width="5"/>
    <!-- Head -->
    <circle cx="30" cy="35" r="30" fill="#A7F3D0" stroke="#059669" stroke-width="5"/>
    <!-- Eye -->
    <circle cx="20" cy="30" r="6" fill="#064E3B"/>
    <circle cx="18" cy="28" r="2" fill="#FFFFFF"/>
    <!-- Wing -->
    <path d="M 65,70 Q 95,30 110,65 Q 85,75 65,80" fill="#FDE047" stroke="#D97706" stroke-width="4"/>
    <!-- Tail -->
    <path d="M 95,95 Q 135,110 140,85" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Bubbles -->
    <circle cx="-10" cy="15" r="10" fill="#BAE6FD" stroke="#38BDF8" stroke-width="3" opacity="0.8"/>
    <circle cx="-35" cy="-5" r="14" fill="#DDD6FE" stroke="#A855F7" stroke-width="3" opacity="0.8"/>
    <circle cx="-60" cy="-30" r="18" fill="#FBCFE8" stroke="#F472B6" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Flowers on the grass -->
  <g fill="#EC4899">
    <circle cx="120" cy="560" r="8"/>
    <circle cx="150" cy="545" r="9"/>
    <circle cx="210" cy="570" r="7"/>
    <circle cx="680" cy="550" r="8"/>
    <circle cx="730" cy="565" r="10"/>
  </g>
</svg>
